---
# General
timezone: Pacific/Auckland
deploy_user: root
deploy_group: root

# Domain
domain: alexserver.home.arpa

# Repo sync path on target
homelab_repo_path: /opt/homelab
docker_compose_dir: "{{ homelab_repo_path }}/docker"

# NFS
nfs_server_ip: 10.10.10.10
nfs_allowed_network: "10.10.10.0/24"

# Docker host IP (used for Caddy upstreams)
docker_host_ip: 10.10.10.50

# Docker stacks to deploy (order matters -- infra first)
enabled_stacks:
  - adventurelog
  - grampsweb
  - koillection
  - portainer
  - uptime-kuma
  - homepage
  - filebrowser

# Stacks that require a templated .env file
stacks_with_env:
  - adventurelog
  - homepage
  - koillection

# Stacks that require templated config files
stacks_with_config:
  - homepage

# Caddy reverse proxy sites (upstreams point to Docker host ports)
caddy_sites:
  - { hostname: adventurelog, upstream: "{{ docker_host_ip }}:3011" }
  - { hostname: adguard, upstream: "10.10.10.20:3000" }
  - { hostname: filebrowser, upstream: "{{ docker_host_ip }}:8003" }
  - { hostname: grampsweb, upstream: "{{ docker_host_ip }}:5000" }
  - hostname: homepage
    upstream: "{{ docker_host_ip }}:3010"
    basicauth_user: "{{ homepage_auth_user }}"
    basicauth_password_hash: "{{ homepage_auth_password_hash }}"
  - { hostname: koillection, upstream: "{{ docker_host_ip }}:8002" }
  - { hostname: portainer, upstream: "{{ docker_host_ip }}:9000" }
  - { hostname: uptime-kuma, upstream: "{{ docker_host_ip }}:3001" }
  - { hostname: pve, upstream: "10.10.10.1:8006", tls_upstream: true }

# AdGuard Home
adguard_admin_user: "{{ vault_adguard_admin_user }}"
adguard_admin_password: "{{ vault_adguard_admin_password }}"
adguard_admin_password_hash: "{{ vault_adguard_admin_password_hash }}"

adguard_dns_rewrites:
  - { domain: "*.alexserver.home.arpa", answer: "10.10.10.30" }
  - { domain: "alexserver.home.arpa", answer: "10.10.10.30" }

# Homepage widget secrets
proxmox_api_token_id: "{{ vault_proxmox_api_token_id }}"
proxmox_api_token_secret: "{{ vault_proxmox_api_token_secret }}"
portainer_api_key: "{{ vault_portainer_api_key }}"

# BorgBackup (runs on storage LXC)
borg_repo: /srv/backup/borg
borg_source_dirs:
  - /srv/data
borg_archive_prefix: homelab
borg_compression: lz4
borg_keep_daily: 5
borg_keep_weekly: 3
borg_keep_monthly: 3
borg_cron_hour: "2"
borg_cron_minute: "0"

# Secrets (referenced from vault.yml)
cloudflared_tunnel_token: "{{ vault_cloudflared_tunnel_token }}"  # used by tunnel LXC role

adventurelog_origin: "{{ vault_adventurelog_origin }}"
adventurelog_db_user: "{{ vault_adventurelog_db_user }}"
adventurelog_db_password: "{{ vault_adventurelog_db_password }}"
adventurelog_django_secret_key: "{{ vault_adventurelog_django_secret_key }}"
adventurelog_admin_user: "{{ vault_adventurelog_admin_user }}"
adventurelog_admin_password: "{{ vault_adventurelog_admin_password }}"
adventurelog_admin_email: "{{ vault_adventurelog_admin_email }}"
adventurelog_public_url: "{{ vault_adventurelog_public_url }}"
adventurelog_csrf_origins: "{{ vault_adventurelog_csrf_origins }}"
adventurelog_frontend_url: "{{ vault_adventurelog_frontend_url }}"

koillection_db_password: "{{ vault_koillection_db_password }}"

# NFS subdirectories required by Docker volume mounts.
# The NFS server role pre-creates these with 0777 so Docker doesn't fail
# in unprivileged LXCs. TODO: Remove when migrating to full VMs.
nfs_stack_subdirs:
  - adventurelog/media
  - grampsweb/users
  - grampsweb/indexdir
  - grampsweb/thumbnail_cache
  - grampsweb/cache
  - grampsweb/secret
  - grampsweb/grampsdb
  - grampsweb/media
  - grampsweb/tmp
  - homepage/config
  - koillection/uploads
  - portainer/data
  - uptime-kuma/data

# Docker host local data backup to NFS (picked up by BorgBackup)
# TODO: Remove when migrating to full VMs (data can live on NFS directly)
docker_data_pg_targets:
  - stack: adventurelog
    container: adventurelog-db
    user: "{{ adventurelog_db_user }}"
    password: "{{ adventurelog_db_password }}"
    dbname: database
  - stack: koillection
    container: koillection-db
    user: koillection
    password: "{{ koillection_db_password }}"
    dbname: koillection

docker_data_rsync_dirs:
  - filebrowser

# External backup sync (runs on Proxmox host)
# To repoint to different storage: change the mount in pve-bootstrap.sh
# and update these paths. The script checks mountpoint before running.
backup_sync_mount: /mnt/usb
backup_sync_dir: "{{ backup_sync_mount }}/Homelab/Backups"
backup_sync_source: /mnt/nfs-backups/latest/latest.tar.gz
backup_sync_cron_hour: "3"
backup_sync_cron_minute: "0"

# Homepage basic auth (Caddy)
homepage_auth_user: "{{ vault_homepage_auth_user }}"
homepage_auth_password_hash: "{{ vault_homepage_auth_password_hash }}"
