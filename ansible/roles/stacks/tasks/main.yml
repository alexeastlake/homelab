---
- name: Create base directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
  loop:
    - { path: /srv/secrets, mode: "0700", owner: root, group: root }
    - { path: "{{ docker_compose_dir }}", mode: "0755", owner: root, group: root }

- name: Sync docker compose files to target
  ansible.posix.synchronize:
    src: "{{ role_path }}/../../../docker/"
    dest: "{{ docker_compose_dir }}/"
    delete: false
    rsync_path: rsync
    rsync_opts:
      - "--exclude=.env"
      - "--exclude=conf.yml"
      - "--exclude=conf.yaml"
      - "--exclude=Caddyfile"

- name: Deploy enabled stacks
  ansible.builtin.include_tasks: deploy_stack.yml
  loop: "{{ enabled_stacks }}"
  loop_control:
    loop_var: stack_name
