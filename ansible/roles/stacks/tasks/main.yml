---
- name: Sync docker compose files to target
  ansible.posix.synchronize:
    src: "{{ role_path }}/../../../docker/"
    dest: "{{ docker_compose_dir }}/"
    delete: false
    rsync_path: rsync
    rsync_opts:
      - "--exclude=.env"
      - "--exclude=conf.yml"
      - "--exclude=conf.yaml"

- name: Deploy enabled stacks
  ansible.builtin.include_tasks: deploy_stack.yml
  loop: "{{ enabled_stacks }}"
  loop_control:
    loop_var: stack_name
