---
- name: Add Cloudflare GPG key
  ansible.builtin.get_url:
    url: https://pkg.cloudflare.com/cloudflare-main.gpg
    dest: /usr/share/keyrings/cloudflare-main.gpg
    mode: "0644"

- name: Add Cloudflare apt repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared bookworm main"
    state: present
    filename: cloudflared

- name: Install cloudflared
  ansible.builtin.apt:
    name: cloudflared
    state: present
    update_cache: true  # needed after adding new repo

- name: Set QUIC UDP buffer sizes (best-effort, may fail in unprivileged LXC)
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    reload: true
  loop:
    - { key: net.core.rmem_max, value: "7500000" }
    - { key: net.core.wmem_max, value: "7500000" }
  ignore_errors: true

- name: Install cloudflared as a service
  ansible.builtin.command:
    cmd: "cloudflared service install {{ cloudflared_tunnel_token }}"
    creates: /etc/systemd/system/cloudflared.service
  notify: restart cloudflared

# TODO: Remove http2 override when migrating to full VMs (QUIC sysctl will work natively)
- name: Create systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/cloudflared.service.d
    state: directory
    mode: "0755"

- name: Force HTTP/2 protocol (QUIC fails in unprivileged LXC)
  ansible.builtin.copy:
    dest: /etc/systemd/system/cloudflared.service.d/override.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/cloudflared --no-autoupdate --protocol http2 tunnel run --token {{ cloudflared_tunnel_token }}
      TimeoutStartSec=60
    mode: "0644"
  notify: restart cloudflared

- name: Ensure cloudflared is enabled and running
  ansible.builtin.systemd:
    name: cloudflared
    state: started
    enabled: true
