---
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - curl
    state: present

- name: Add Caddy GPG key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /usr/share/keyrings/caddy-stable-archive-keyring.asc
    mode: "0644"

- name: Add Caddy apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.asc] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
    filename: caddy-stable
    state: present

- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true  # needed after adding new repo

- name: Create Caddy PKI directory
  ansible.builtin.file:
    path: /var/lib/caddy/.local/share/caddy/pki/authorities/local
    state: directory
    mode: "0700"
    owner: caddy
    group: caddy

- name: Deploy shared root CA certificate
  ansible.builtin.copy:
    content: "{{ vault_caddy_root_ca_cert }}"
    dest: /var/lib/caddy/.local/share/caddy/pki/authorities/local/root.crt
    mode: "0644"
    owner: caddy
    group: caddy
  notify: restart caddy

- name: Deploy shared root CA key
  ansible.builtin.copy:
    content: "{{ vault_caddy_root_ca_key }}"
    dest: /var/lib/caddy/.local/share/caddy/pki/authorities/local/root.key
    mode: "0600"
    owner: caddy
    group: caddy
  notify: restart caddy

- name: Template Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: "0644"
  notify: reload caddy

- name: Ensure Caddy is enabled and running
  ansible.builtin.systemd:
    name: caddy
    state: started
    enabled: true
