---
- name: Ensure borgbackup is installed
  ansible.builtin.apt:
    name: borgbackup
    state: present

- name: Ensure backup directory exists
  ansible.builtin.file:
    path: "{{ borg_repo }}"
    state: directory
    mode: "0750"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"

- name: Check if Borg repo is initialized
  ansible.builtin.command: borg info {{ borg_repo }}
  register: borg_info
  changed_when: false
  failed_when: false

- name: Initialize Borg repo
  ansible.builtin.command: borg init --encryption=none {{ borg_repo }}
  when: borg_info.rc != 0

- name: Template backup script
  ansible.builtin.template:
    src: borg-backup.sh.j2
    dest: /usr/local/bin/borg-backup.sh
    mode: "0755"

- name: Configure backup cron job
  ansible.builtin.cron:
    name: "borg backup"
    minute: "{{ borg_cron_minute }}"
    hour: "{{ borg_cron_hour }}"
    job: "/usr/local/bin/borg-backup.sh >> /var/log/borg.log 2>&1"
    user: root
