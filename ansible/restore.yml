---
# Restores PostgreSQL databases from pg_dump archives on NFS.
# Usage: ansible-playbook restore.yml
# Not part of site.yml — run explicitly after a rebuild to repopulate databases.
# WARNING: Drops and recreates each database. Run deliberately.

- name: Restore PostgreSQL databases
  hosts: homelab
  become: true
  tasks:
    - name: Wait for AdventureLog Postgres to be ready
      ansible.builtin.command: docker exec adventurelog-db pg_isready -U {{ adventurelog_db_user }}
      register: result
      until: result.rc == 0
      retries: 15
      delay: 2
      changed_when: false

    - name: Terminate connections to AdventureLog database
      ansible.builtin.command: >
        docker exec adventurelog-db psql -U postgres -c
        "SELECT pg_terminate_backend(pid) FROM pg_stat_activity
        WHERE datname = 'database' AND pid <> pg_backend_pid();"
      changed_when: false

    - name: Drop and recreate AdventureLog database
      ansible.builtin.command: >
        docker exec adventurelog-db psql -U postgres
        -c "DROP DATABASE IF EXISTS database;"
        -c "CREATE DATABASE database OWNER {{ adventurelog_db_user }};"
      changed_when: true

    - name: Restore AdventureLog database
      ansible.builtin.shell: >
        gunzip -c /srv/data/docker-data/adventurelog/database.sql.gz
        | docker exec -i adventurelog-db psql -U {{ adventurelog_db_user }} -d database
      changed_when: true

    - name: Wait for Koillection Postgres to be ready
      ansible.builtin.command: docker exec koillection-db pg_isready -U koillection
      register: result
      until: result.rc == 0
      retries: 15
      delay: 2
      changed_when: false

    - name: Terminate connections to Koillection database
      ansible.builtin.command: >
        docker exec koillection-db psql -U postgres -c
        "SELECT pg_terminate_backend(pid) FROM pg_stat_activity
        WHERE datname = 'koillection' AND pid <> pg_backend_pid();"
      changed_when: false

    - name: Drop and recreate Koillection database
      ansible.builtin.command: >
        docker exec koillection-db psql -U postgres
        -c "DROP DATABASE IF EXISTS koillection;"
        -c "CREATE DATABASE koillection OWNER koillection;"
      changed_when: true

    - name: Restore Koillection database
      ansible.builtin.shell: >
        gunzip -c /srv/data/docker-data/koillection/koillection.sql.gz
        | docker exec -i koillection-db psql -U koillection -d koillection
      changed_when: true

    - name: Restart app containers to reconnect to restored databases
      ansible.builtin.command: docker restart adventurelog-backend adventurelog-frontend koillection
      changed_when: true
