---
# --- Foundation: Storage ---
- name: Provision storage server
  hosts: storage
  become: true
  roles:
    - common
    - nfs_server
    - samba
    - borgbackup

# --- Networking: DNS ---
- name: Provision DNS server
  hosts: dns
  become: true
  roles:
    - common
    - adguard

# --- Networking: Reverse proxy ---
- name: Provision reverse proxy
  hosts: caddy
  become: true
  roles:
    - common
    - caddy

# --- Networking: Cloudflare tunnel ---
- name: Provision Cloudflare tunnel
  hosts: tunnel
  become: true
  roles:
    - common
    - cloudflared

# --- Compute: Docker host ---
- name: Provision Docker host
  hosts: homelab
  become: true
  roles:
    - common
    - docker
    - stacks
    - docker_data_backup

# --- Backup: External storage sync ---
- name: Sync backups to external storage
  hosts: pve
  become: true
  roles:
    - backup_sync
