services:
  samba:
    image: dockurr/samba:latest
    container_name: samba
    restart: unless-stopped
    ports:
      - "445:445"
    environment:
      NAME: "${SMB_NAME}"
      USER: "${SMB_USER}"
      PASS: "${SMB_PASS}"
      UID: "${SMB_UID}"
      GID: "${SMB_GID}"
    volumes:
      - /srv/data/storage:/storage
